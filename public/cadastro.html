
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de produtos</title>
</head>
<body>
    <h1>Cadastro de produtos</h1>

    <form action="/produtos" method="POST">
        <label for="nome">Nome do produto:</label>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" name="preco" min="0.01" step="0.01" required>
        <br><br>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" name="quantidade" min="0" step="1" required>
        <br><br>

        <button type="submit">Cadastrar produto</button>
    </form>

    <hr>

    <h2>Excluir produto</h2>

    <form action="/produtos/excluir" method="POST">
        <label for="id">Código do produto:</label>
        <input type="number" id="id" name="id" min="1" required>
        <button type="submit">Excluir</button>
    </form>

    <p><a href="/produtos">Visualizar produtos cadastrados</a></p>
</body>
</html>
